# fly.toml app configuration file for salexpress-docs-frontend
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'salexpress-docs-frontend'
primary_region = 'gru'

[build]
  [build.args]
    VITE_API_URL = "https://salexpress-docs-api.fly.dev"

[http_service]
  internal_port = 80
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0
  processes = ['app']

[[vm]]
  memory = '256mb'
  cpu_kind = 'shared'
  cpus = 1
  memory_mb = 256
